<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعيين مدربي الجيوجيتسو — بوابة الجود</title>
<script src="../platform-config.js"></script>
<script src="../platform-auth-guard.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', Arial, sans-serif;
    background: #0f1923;
    color: #e8f0fe;
    min-height: 100vh;
    font-size: 18px;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a2a3a 0%, #162132 100%);
    border-bottom: 2px solid #6C3DD6;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-box {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #6C3DD6, #22D3EE);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .header h1 { font-size: 20px; font-weight: 800; color: #fff; }
  .header h1 span { color: #22D3EE; }
  .btn-back {
    background: #1e3a5f;
    color: #22D3EE;
    border: 1px solid #22D3EE44;
    border-radius: 8px;
    padding: 8px 18px;
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-back:hover { background: #22D3EE22; }

  /* ── Layout ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* ── Info bar ── */
  .info-bar {
    background: #162132;
    border: 1px solid #6C3DD644;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .info-bar .badge {
    background: #6C3DD622;
    border: 1px solid #6C3DD6;
    color: #a78bfa;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 15px;
    font-weight: 700;
  }
  .info-bar p { color: #94a3b8; font-size: 16px; }

  /* ── Coach legend ── */
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    background: #162132;
    border: 1px solid #ffffff11;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 15px;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    background: #1e3a5f;
    color: #94a3b8;
    border: 1px solid #ffffff22;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Tajawal', sans-serif;
    font-size: 16px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #6C3DD6;
    color: #fff;
    border-color: #6C3DD6;
  }
  .btn-save-all {
    margin-right: auto;
    background: linear-gradient(135deg, #6C3DD6, #22D3EE);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 28px;
    font-family: 'Tajawal', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-save-all:hover { opacity: 0.9; }
  .btn-save-all:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── Grade section ── */
  .grade-section { margin-bottom: 32px; }
  .grade-header {
    background: #1a2a3a;
    border-right: 4px solid #6C3DD6;
    border-radius: 0 10px 10px 0;
    padding: 12px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .grade-title { font-size: 18px; font-weight: 800; color: #fff; }
  .grade-badge {
    background: #6C3DD622;
    color: #a78bfa;
    border: 1px solid #6C3DD6;
    border-radius: 6px;
    padding: 2px 10px;
    font-size: 14px;
  }
  .mixed-badge {
    background: #0ea5e922;
    color: #38bdf8;
    border: 1px solid #0ea5e9;
  }
  .girls-badge {
    background: #ec489922;
    color: #f472b6;
    border: 1px solid #ec4899;
  }

  /* ── Classes grid ── */
  .classes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .class-card {
    background: #162132;
    border: 1px solid #ffffff11;
    border-radius: 12px;
    padding: 18px;
    transition: border-color 0.2s;
  }
  .class-card:hover { border-color: #6C3DD644; }
  .class-card.modified { border-color: #f59e0b; }
  .class-name {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .class-name .modified-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    display: none;
  }
  .class-card.modified .modified-dot { display: block; }

  /* ── Coach row ── */
  .coach-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .coach-label {
    font-size: 14px;
    color: #64748b;
    width: 60px;
    flex-shrink: 0;
  }
  .coach-select {
    flex: 1;
    background: #1e3a5f;
    color: #e8f0fe;
    border: 1px solid #ffffff22;
    border-radius: 8px;
    padding: 6px 10px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    cursor: pointer;
  }
  .coach-select:focus { outline: none; border-color: #6C3DD6; }
  .coach-select:disabled {
    opacity: 0.6;
    cursor: default;
    background: #0f1923;
  }
  .coach-fixed {
    flex: 1;
    background: #0f1923;
    border: 1px solid #ffffff11;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 15px;
    color: #4ade80;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Status bar ── */
  .status-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0f1923;
    border-top: 1px solid #ffffff11;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
  }
  .status-text { color: #64748b; font-size: 15px; }
  .status-text.success { color: #4ade80; }
  .status-text.error { color: #f87171; }
  .status-text.saving { color: #facc15; }
  .pending-count {
    background: #f59e0b22;
    color: #f59e0b;
    border: 1px solid #f59e0b44;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 15px;
    font-weight: 700;
  }

  /* ── Loading ── */
  .loading {
    text-align: center;
    padding: 60px;
    color: #64748b;
    font-size: 18px;
  }
  .spinner {
    display: inline-block;
    width: 40px; height: 40px;
    border: 3px solid #ffffff11;
    border-top-color: #6C3DD6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .classes-grid { grid-template-columns: 1fr; }
    .controls { flex-direction: column; align-items: stretch; }
    .btn-save-all { margin-right: 0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <div class="logo-box">🥋</div>
    <div>
      <h1>تعيين مدربي <span>الجيوجيتسو</span></h1>
      <div style="font-size:13px;color:#64748b;">توزيع المدربين على الشعب — مدرسة الجود</div>
    </div>
  </div>
  <a href="../eduos-admin/" class="btn-back">→ الرجوع</a>
</div>

<div class="container">

  <div class="info-bar">
    <span class="badge">🥋 الجيوجيتسو</span>
    <p>
      صفوف <strong style="color:#fff;">G1–G4</strong>: مختلطة — مدرب أولاد (ماكس) + مدربة بنات يُختار | 
      صفوف <strong style="color:#fff;">G5–G8</strong>: بنات فقط — مدربة يُختار
    </p>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:#4ade80;"></div>
      <span>ماكس — ثابت (أولاد)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#a78bfa;"></div>
      <span>إيزا</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#f472b6;"></div>
      <span>برونا</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#38bdf8;"></div>
      <span>فران</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:#fb923c;"></div>
      <span>كلوديا</span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="filter-btn active" onclick="filterGrade('all')">جميع الصفوف</button>
    <button class="filter-btn" onclick="filterGrade('1')">الصف 1</button>
    <button class="filter-btn" onclick="filterGrade('2')">الصف 2</button>
    <button class="filter-btn" onclick="filterGrade('3')">الصف 3</button>
    <button class="filter-btn" onclick="filterGrade('4')">الصف 4</button>
    <button class="filter-btn" onclick="filterGrade('5')">الصف 5</button>
    <button class="filter-btn" onclick="filterGrade('6')">الصف 6</button>
    <button class="filter-btn" onclick="filterGrade('7')">الصف 7</button>
    <button class="filter-btn" onclick="filterGrade('8')">الصف 8</button>
    <button class="btn-save-all" id="btnSaveAll" onclick="saveAll()" disabled>
      💾 حفظ التغييرات
    </button>
  </div>

  <!-- Content -->
  <div id="mainContent">
    <div class="loading">
      <div class="spinner"></div>
      <div>جاري تحميل البيانات...</div>
    </div>
  </div>

</div>

<!-- Status bar -->
<div class="status-bar">
  <span id="statusText" class="status-text">جاهز</span>
  <span id="pendingCount" class="pending-count" style="display:none;">0 تعديل معلّق</span>
</div>

<script>
const SB_URL = window.EduOS?.SB_URL || 'https://zuyizaiugpmhmeycqton.supabase.co';
const SB_KEY = window.EduOS?.SB_KEY || '';

// مدربو الجيوجيتسو
const COACHES_FEMALE = [
  { id: 'COACH001', name: 'إيزا', color: '#a78bfa' },
  { id: 'COACH002', name: 'برونا', color: '#f472b6' },
  { id: 'COACH003', name: 'فران', color: '#38bdf8' },
  { id: 'COACH004', name: 'كلوديا', color: '#fb923c' }
];
const COACH_MALE = { id: 'COACH005', name: 'ماكس' };
const MIXED_GRADES = ['1','2','3','4']; // G1-G4 مختلطة

// بيانات التعيينات الحالية
let assignments = {}; // { class_name: { female_coach_id, has_male } }
let pendingChanges = {}; // { class_name: new_female_coach_id }
let currentFilter = 'all';

async function sbFetch(path, opts = {}) {
  const res = await fetch(SB_URL + path, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, ...opts.headers },
    ...opts
  });
  return res.json();
}

// تحميل التعيينات الحالية من schedules
async function loadAssignments() {
  try {
    const data = await sbFetch(
      "/rest/v1/schedules?subject=ilike.*جيو*&select=class_name,teacher_id,teacher_name&is_active=eq.true",
      { headers: { 'Prefer': 'return=representation' } }
    );

    assignments = {};
    if (Array.isArray(data)) {
      data.forEach(row => {
        const c = row.class_name;
        if (!assignments[c]) assignments[c] = { female: null, hasMale: false };
        if (row.teacher_id === COACH_MALE.id) {
          assignments[c].hasMale = true;
        } else {
          assignments[c].female = row.teacher_id;
        }
      });
    }

    // تحديد الصفوف المتاحة
    const classes = [...new Set(Object.keys(assignments))].sort((a,b) => {
      const ga = parseInt(a), gb = parseInt(b);
      if (ga !== gb) return ga - gb;
      return a.localeCompare(b);
    });

    // تجميع حسب الصف
    const byGrade = {};
    classes.forEach(c => {
      const g = c.replace(/[A-Za-z]/g,'');
      if (!byGrade[g]) byGrade[g] = [];
      byGrade[g].push(c);
    });

    renderAll(byGrade);
    setStatus('تم تحميل ' + classes.length + ' شعبة', '');

  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      '<div class="loading" style="color:#f87171;">خطأ في تحميل البيانات: ' + e.message + '</div>';
  }
}

function renderAll(byGrade) {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';

  Object.keys(byGrade).sort((a,b) => parseInt(a)-parseInt(b)).forEach(grade => {
    const section = document.createElement('div');
    section.className = 'grade-section';
    section.dataset.grade = grade;

    const isMixed = MIXED_GRADES.includes(grade);
    section.innerHTML = `
      <div class="grade-header">
        <span class="grade-title">الصف ${grade}</span>
        <span class="grade-badge ${isMixed ? 'mixed-badge' : 'girls-badge'}">
          ${isMixed ? '🔵 مختلط' : '🌸 بنات فقط'}
        </span>
        <span style="color:#64748b;font-size:14px;">${byGrade[grade].length} شعب</span>
      </div>
      <div class="classes-grid" id="grid-${grade}"></div>
    `;
    container.appendChild(section);

    const grid = section.querySelector('.classes-grid');
    byGrade[grade].forEach(cls => {
      grid.appendChild(renderClassCard(cls, isMixed));
    });
  });

  applyFilter();
}

function renderClassCard(cls, isMixed) {
  const asgn = assignments[cls] || { female: null, hasMale: false };
  const currentFemale = asgn.female || 'COACH001';
  const card = document.createElement('div');
  card.className = 'class-card';
  card.id = 'card-' + cls;

  let femaleOptions = COACHES_FEMALE.map(c =>
    `<option value="${c.id}" ${currentFemale === c.id ? 'selected' : ''}>${c.name}</option>`
  ).join('');

  let maleSection = '';
  if (isMixed) {
    maleSection = `
      <div class="coach-row">
        <span class="coach-label">أولاد:</span>
        <div class="coach-fixed">✅ ماكس (ثابت)</div>
      </div>
    `;
  }

  card.innerHTML = `
    <div class="class-name">
      <span>شعبة ${cls}</span>
      <div class="modified-dot"></div>
    </div>
    ${maleSection}
    <div class="coach-row">
      <span class="coach-label">${isMixed ? 'بنات:' : 'مدربة:'}</span>
      <select class="coach-select" id="sel-${cls}" onchange="onSelectChange('${cls}', this.value)">
        ${femaleOptions}
      </select>
    </div>
  `;

  return card;
}

function onSelectChange(cls, newCoachId) {
  const original = assignments[cls]?.female || 'COACH001';
  if (newCoachId !== original) {
    pendingChanges[cls] = newCoachId;
    document.getElementById('card-' + cls).classList.add('modified');
  } else {
    delete pendingChanges[cls];
    document.getElementById('card-' + cls).classList.remove('modified');
  }
  updatePendingUI();
}

function updatePendingUI() {
  const count = Object.keys(pendingChanges).length;
  const btn = document.getElementById('btnSaveAll');
  const badge = document.getElementById('pendingCount');
  btn.disabled = count === 0;
  if (count > 0) {
    badge.style.display = 'inline-flex';
    badge.textContent = count + ' تعديل معلّق';
  } else {
    badge.style.display = 'none';
  }
}

function filterGrade(grade) {
  currentFilter = grade;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.grade-section').forEach(s => {
    s.style.display = (currentFilter === 'all' || s.dataset.grade === currentFilter) ? '' : 'none';
  });
}

async function saveAll() {
  if (Object.keys(pendingChanges).length === 0) return;

  const btn = document.getElementById('btnSaveAll');
  btn.disabled = true;
  setStatus('جاري الحفظ...', 'saving');

  let saved = 0;
  let errors = 0;

  for (const [cls, coachId] of Object.entries(pendingChanges)) {
    const coach = COACHES_FEMALE.find(c => c.id === coachId);
    const coachName = coach ? coach.name + ' — مدرب/ة جيوجيتسو' : coachId;

    try {
      // تحديث صف المدربة الأنثى في schedules
      const res = await fetch(SB_URL + '/rest/v1/schedules?class_name=eq.' + cls + '&subject=ilike.*جيو*&teacher_id=neq.' + COACH_MALE.id, {
        method: 'PATCH',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ teacher_id: coachId, teacher_name: coachName })
      });

      if (res.ok || res.status === 204) {
        // تحديث الذاكرة المحلية
        if (!assignments[cls]) assignments[cls] = { female: null, hasMale: false };
        assignments[cls].female = coachId;
        document.getElementById('card-' + cls).classList.remove('modified');
        saved++;
      } else {
        errors++;
      }
    } catch(e) {
      errors++;
    }
  }

  pendingChanges = {};
  updatePendingUI();

  if (errors === 0) {
    setStatus('✅ تم حفظ ' + saved + ' تعديل بنجاح', 'success');
  } else {
    setStatus('⚠️ تم حفظ ' + saved + ' — فشل ' + errors, 'error');
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('statusText');
  el.textContent = msg;
  el.className = 'status-text ' + (type || '');
}

// التحقق من الصلاحية
window.addEventListener('DOMContentLoaded', () => {
  const s = JSON.parse(sessionStorage.getItem('edoos_user') || '{}');
  const allowed = ['admin', 'principal', 'vice_principal'];
  if (!s.role_key || !allowed.includes(s.role_key)) {
    document.body.innerHTML = '<div style="text-align:center;padding:80px;color:#f87171;font-family:Tajawal,sans-serif;font-size:20px;">⛔ غير مصرح بالوصول</div>';
    return;
  }
  loadAssignments();
});
</script>
</body>
</html>
